<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Web 01 - Layout Tabel</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 20px;
      background-color: #ffffff;
    }

    /* Container Tabel menggunakan border-separate agar warna border tiap sel tidak saling menimpa */
    table.layout-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      border-collapse: separate;
      border-spacing: 0;
    }

    /* =========================================
       HEADER & FOOTER (Border Cokelat/Oranye)
       ========================================= */

    .bg-header-footer {
      background-color: #ffebd2;
      border: 1px solid #e2a865 !important;
      text-align: center;
      font-weight: normal;
      color: #333333;
      padding: 22px 15px !important;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* =========================================
       NAVIGATION (Border Biru)
       ========================================= */

    .bg-nav {
      background-color: #deebff;
      border: 1px solid #8fb3e8 !important;
      text-align: center;
      font-weight: normal;
      color: #333333;
      padding: 16px 15px !important;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* =========================================
       MAIN CONTENT (Border Pink/Merah Muda)
       ========================================= */

    .bg-content {
      background-color: #f8c8d4;
      border: 1px solid #d98fa5 !important;
      width: 68%;
      height: 320px;
      padding: 40px 30px !important;
      box-sizing: border-box;
      vertical-align: top;
    }

    .bg-content h1 {
      margin-top: 25px;
      margin-bottom: 25px;
      font-size: 34px;
      font-weight: bold;
      color: #000000;
    }

    .bg-content p {
      font-size: 14px;
      line-height: 1.35;
      color: #222222;
      width: 290px;
      margin: 0;
    }

    /* =========================================
       SIDEBAR (Border Hijau)
       ========================================= */

    .bg-sidebar {
      background-color: #d2eabd;
      border: 1px solid #8fbc91 !important;
      width: 32%;
      padding: 85px 20px 20px 0px !important;
      box-sizing: border-box;
      vertical-align: top;
    }

    .bg-sidebar strong {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #000000;
      font-weight: bold;
    }

    .bg-sidebar ul {
      margin: 0;
      /* ==============================================================================
         Ubah nilai 'padding-left' ini untuk menggeser Home, Berita, Layanan, Kontak:
         - Semakin BESAR angkanya (misal: 45px / 60px), daftar akan semakin bergeser ke KANAN.
         - Semakin KECIL angkanya (misal: 15px), daftar akan bergeser ke KIRI.
         ============================================================================== */
      padding-left: 45px;
    }

    .bg-sidebar li {
      font-size: 13px;
      line-height: 1.4;
      color: #000000;
    }
  </style>
</head>

<body>

  <table class="layout-container">

    <!-- Row 1: Header -->
    <tr>
      <td colspan="2" class="bg-header-footer">
        <header>HEADER</header>
      </td>
    </tr>

    <!-- Row 2: Navigasi -->
    <tr>
      <td colspan="2" class="bg-nav">
        <nav>NAVIGASI</nav>
      </td>
    </tr>

    <!-- Row 3: Main Content & Sidebar Menu -->
    <tr>

      <td class="bg-content">
        <main>
          <article>
            <h1>Heading 1</h1>

            <p>
              Lorem ipsum dolor sit amet, consectetur
              adipisicing elit, sed do eiusmod tempor
              incididunt ut labore et dolore magna aliqua.
            </p>
          </article>
        </main>
      </td>

      <td class="bg-sidebar">
        <aside>
          <strong>Menu:</strong>

          <ul>
            <li>Home</li>
            <li>Berita</li>
            <li>Layanan</li>
            <li>Kontak</li>
          </ul>
        </aside>
      </td>

    </tr>

    <!-- Row 4: Footer -->
    <tr>
      <td colspan="2" class="bg-header-footer">
        <footer>FOOTER</footer>
      </td>
    </tr>

  </table>

</body>
</html>
